[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-intelligence"
version = "0.2.0"
description = "Read-only C2 and publisher-history importers with immutable evidence and audit gates"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trading-intelligence = "trading_intelligence.cli:main"

[tool.setuptools.packages.find]
include = ["trading_intelligence*"]
