name: Offline import tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic end-to-end demo
        run: python -m trading_intelligence demo --out "$RUNNER_TEMP/trading-demo"
