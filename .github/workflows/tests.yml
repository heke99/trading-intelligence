name: Offline foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test synthetic contracts and temporal replay
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run offline CLI example
        env:
          PYTHONPATH: src
        run: python -m trading_intelligence demo --out "${RUNNER_TEMP}/ti-demo"
      - name: Run synthetic event revisions and facility context
        env:
          PYTHONPATH: src
        run: python -m trading_intelligence event-intelligence-demo --out "${RUNNER_TEMP}/ti-events-demo"
      - name: Run synthetic source-cited event scenarios without API access
        env:
          PYTHONPATH: src
        run: python -m trading_intelligence event-analysis-demo --out "${RUNNER_TEMP}/ti-event-analysis-demo"
      - name: Run synthetic event price and exposure sensitivity
        env:
          PYTHONPATH: src
        run: python -m trading_intelligence event-opportunity-demo --out "${RUNNER_TEMP}/ti-opportunity-demo"
      - name: Run offline futures example
        env:
          PYTHONPATH: src
        run: python -m trading_intelligence futures-demo --out "${RUNNER_TEMP}/ti-futures-demo"
      - name: Run multi-broker offline example
        env:
          PYTHONPATH: src
        run: python -m trading_intelligence brokers-demo --out "${RUNNER_TEMP}/ti-brokers-demo"
      - name: Run offline broker import example
        env:
          PYTHONPATH: src
        run: python -m trading_intelligence reference-import-demo --out "${RUNNER_TEMP}/ti-reference-import-demo"
      - name: Run offline market staging and replay example
        env:
          PYTHONPATH: src
        run: python -m trading_intelligence market-pipeline-demo --out "${RUNNER_TEMP}/ti-market-demo"
      - name: Run offline corporate-action and rename proof
        env:
          PYTHONPATH: src
        run: python -m trading_intelligence corporate-replay-demo --out "${RUNNER_TEMP}/ti-corporate-demo"
      - name: Run offline calendar and admission-gate example
        env:
          PYTHONPATH: src
        run: python -m trading_intelligence admission-demo --out "${RUNNER_TEMP}/ti-admission-demo"
      - name: Run four source and research foundation examples
        env:
          PYTHONPATH: src
        run: python -m trading_intelligence research-foundations-demo --out "${RUNNER_TEMP}/ti-research-foundations-demo"
      - name: Run four offline LEAN readiness prerequisites
        env:
          PYTHONPATH: src
        run: python -m trading_intelligence lean-readiness-demo --out "${RUNNER_TEMP}/ti-lean-readiness-demo"
      - name: Inventory configuration without external access
        env:
          PYTHONPATH: src
        run: python -m trading_intelligence readiness
      - name: Prepare pinned isolated LEAN smoke without executing Docker
        env:
          PYTHONPATH: src
        run: python -m trading_intelligence.lean_smoke prepare-run --out "${RUNNER_TEMP}/ti-observer-smoke" --prepare-only
      - name: Prepare synthetic rule/fill/accounting trial without executing Docker
        env:
          PYTHONPATH: src
        run: python -m trading_intelligence.lean_baseline_smoke prepare-run --out "${RUNNER_TEMP}/ti-baseline-smoke" --prepare-only
