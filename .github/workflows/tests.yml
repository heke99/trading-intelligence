name: Offline foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test synthetic contracts and temporal replay
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run offline CLI example
        env:
          PYTHONPATH: src
        run: python -m trading_intelligence demo --out "${RUNNER_TEMP}/ti-demo"
      - name: Run offline futures example
        env:
          PYTHONPATH: src
        run: python -m trading_intelligence futures-demo --out "${RUNNER_TEMP}/ti-futures-demo"
      - name: Run multi-broker offline example
        env:
          PYTHONPATH: src
        run: python -m trading_intelligence brokers-demo --out "${RUNNER_TEMP}/ti-brokers-demo"
