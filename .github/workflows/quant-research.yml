name: Optional quant research
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-quant.txt
      - name: Exercise real open-source numerical integrations
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_quant_research.py -v
          python -m trading_intelligence.quant_research_demo
